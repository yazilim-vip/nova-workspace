apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
data:
  # Gateway configuration (JSON5)
  # Customize channels, providers, and agent settings here.
  # See references/gateway-config.md for the full schema reference.
  openclaw.json: |
    {
      "gateway": {
        "bind": "lan",
        "port": 18789,
        "auth": {
          "mode": "token"
        }
      },
      "channels": {
        "discord": {
          "enabled": true,
          "token": {
            "ref-source": "env",
            "ref-id": "DISCORD_BOT_TOKEN"
          },
          "dmPolicy": "pairing",
          "groupPolicy": "allowlist",
          "guilds": {
            "YOUR_SERVER_ID": {
              "requireMention": true,
              "users": ["YOUR_USER_ID"]
            }
          },
          "replyToMode": "first",
          "streaming": "partial"
        }
      },
      "models": {
        "providers": {
          "ollama": {
            "baseUrl": "https://ollama.com",
            "api": "ollama",
            "models": [
              {
                "id": "qwen3-coder:480b-cloud",
                "name": "Qwen3 Coder 480B Cloud"
              }
            ]
          }
        }
      },
      "agents": {
        "defaults": {
          "model": "ollama/qwen3-coder:480b-cloud"
        }
      }
    }
  # Agent instructions injected as system prompt.
  AGENTS.md: |
    # OpenClaw Agent

    You are a helpful AI assistant.

    ## Behavior
    - Be concise and helpful
    - Use markdown formatting where appropriate
